name = "cd-checker"
main = "index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Environment variables — put your real secrets in Cloudflare dashboard
# or use `wrangler secret put WCL_CLIENT_ID` / `wrangler secret put WCL_CLIENT_SECRET`
# DO NOT commit real credentials to this file.

[assets]
directory = "../frontend"
binding = "ASSETS"

[vars]
ALLOWED_ORIGIN = "https://cd-checker.johnbxu.workers.dev"

# To add secrets via CLI:
#   wrangler secret put WCL_CLIENT_ID
#   wrangler secret put WCL_CLIENT_SECRET
#
# Or set them in the Cloudflare dashboard under:
#   Workers & Pages → cd-checker → Settings → Variables
